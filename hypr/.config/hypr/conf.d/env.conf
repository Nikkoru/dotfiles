# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Original-Classic
env = HYPRCURSOR_SIZE,24

env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XDG_MENU_PREFIX,arch-
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,0

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb

env = GDK_SCALE,1

# WARNING: This config is specific to hybrids graphics with Intel and Nvidia cards. 
# You may have issues with this environment variables.
#
# The first environment variable requires that your graphics cards are symlinked
# like in the env. Use udev rules to symlink the cards to this path or comment the 
# line entirely.
#
# You can also change the symlink.
#
# See https://wiki.hypr.land/Configuring/Multi-GPU/

env = AQ_DRM_DEVICES,/dev/dri/intel-card:/dev/dri/nvidia-card

# The other Environment variables are Nvidia specific configuration recommended to 
# use in Hyprland wiki.
#
# See https://wiki.hypr.land/Nvidia/#environment-variables

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,0
env = WLR_DRM_NO_ATOMIC,1
env = __GL_SYNC_DISPLAY_DEVICE,HDMI-A-1

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps
