# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize window with keyboard only
bind = $mainMod CONTROL, H, resizeactive, 0 10
bind = $mainMod SHIFT, H, resizeactive, 0 -10
bind = $mainMod CONTROL, W, resizeactive, 10 0
bind = $mainMod SHIFT, W, resizeactive, -10 0

# Group managment 
bind = $mainMode, G, togglegroup
bind = $mainMode SHIFT, L, lockactivegroup
bind = $mainMode SHIFT, Tab, changegroupactive

# Window in a group control
bind = $mainMode, X, moveoutofgroup
bind = $mainMode SHIFT, X, moveintogroup

# Centering
bind = $mainMod SHIFT, C, centerwindow

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
